[project]
name = "librenmsapi"
version = "0.0.2"
description = "Python client for the LibreNMS API"
authors = [
   {name = "Markus Juenemann", email = "markus@juenemann.net"}
]
license = { file = "LICENSE" }
readme = "README.md"
dependencies = [
    "requests>=2.32.4",
]
requires-python = ">=3.8"

[build-system]
requires = ["uv_build>=0.12.18,<0.13"]
build-backend = "uv_build"

[project.urls]
Home = "https://github.com/mjuenema/python-librenmsapi"

[tool.flit.sdist]
exclude = ["tests/*"]

[dependency-groups]
dev = [
    "black>=24.8.0",
    "case-converter>=1.2.0",
    "jinja2>=3.1.6",
    "mistune>=3.3.4",
    "pytest>=8.3.5",
    "pytest-env>=1.1.5",
]

[tool.pytest.ini_options]
env = [
    "LIBRENMS_URL = http://192.168.178.43:8000",
    "LIBRENMS_TOKEN = dbf96fa7eeb5aa05baaadfba8dbd11bb",
]
